<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, inttial-scale=1.0">
        <tittle> Criar Conta</tittle>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="card">
            <h2> Criar Conta</h2>

            <div class="form-group">
                <label for="nome"> Nome completo </label>
                <input type="text" id="nome" placeholder="Digite seu nome">

            </div>

            <div class="form-group">
                <label for="nascimento">Data de nascimento </label>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00)00000-0000">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu E-mail">
            </div>

            <button type="button" class="btn-principal" id="btnSalvar">Cadastrar</button>
            <a href="index.html" class="btn-secundaria">Votar para o login</a>

            <div class="mensagem" id="mensagemcadastro"></div>
        </div>
        <script src="cadastro.js"></script>
    </body>
</html>
